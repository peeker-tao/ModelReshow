[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mum"
version = "0.1.0"
description = "MuM: Multi-View Masked Image Modeling for 3D Vision"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "David Nordström" },
    { name = "Johan Edstedt" },
    { name = "Fredrik Kahl" },
    { name = "Georg Bökman" },
]
dependencies = [
    "torch",
    "torchvision",
    "pillow",
]

[project.optional-dependencies]
viz = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mum*"]
