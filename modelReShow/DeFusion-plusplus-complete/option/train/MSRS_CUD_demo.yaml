# DeFusion++ Stage-1 (CUD) demo training on MSRS
# NOTE: the original paper uses COCO (~118k images) for CUD pretraining.
# This demo points to MSRS train/ir (1083 images) so it runs out of the box.
# Run:  python selftrain.py -opt option/train/MSRS_CUD_demo.yaml
name: MSRS_CUD_demo
use_tb_logger: true
model: UCMConv

dataset:
  train:
    name: train
    dataroot: /data1/Taohy/dataset/MSRS
    trainpairs: data/msrs_cud_train_data.txt
    batch_size: 4
    image_size: 224
    max_iter: 40
    iter_size: 1
    workers: 2
    train_name: train/ir
    debug: true

  val:
    name: val
    dataroot: /data1/Taohy/dataset/MSRS
    batch_size: 1
    workers: 1
    input_name: test/ir

network_G:
  in_nc: 3
  block_num: 2
  init: xavier
  hidden_channels: 128
  K: 4

path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

logger:
  print_freq: 10
  save_checkpoint_freq: 1

train:
  lr: !!float 4e-4
  beta1: 0.9
  beta2: 0.999
  max_grad_norm: 20
  max_grad_clip: 20
  niter: 500000
  epoch: 2

  lr_steps: [20, 40, 45, 47]
  lr_gamma: 0.5

  val_freq: 3
  kernel_freq: 1
  manual_seed: 1
