# ============================================================
# DeFusion++ 两阶段训练 —— 阶段 2：CUD + MCUD 联合训练
# 目标：在阶段 1（分解+融合能力）基础上叠加多模态对齐能力
# 数据：CUD(COCO train2017) + MCUD(MSRS train IR/VI 成对 1083 对)
# 总步数：30000 步（每步同时吃一个 CUD batch + 一个 MCUD batch）
# 特点：mode='mcud' → 创建冻结 MAE 教师；init_from 加载阶段 1 权重（冷启动，lr 重新 warmup）
# Run:  python selftrain_multimodal.py -opt option/train/COCO_MSRS_MCUD_phase2.yaml
# ============================================================
name: COCO_MSRS_MCUD_phase2
model: MUCMTransformer
track_wandb: true
wandb_project: DeFusion-plusplus
wandb_entity: 3222703726-huazhong-university-of-science-and-technology
use_tb_logger: false

dataset:
  train:
    name: train
    # CUD 分支数据：COCO train2017 单模态 grid-mask 自监督
    noise_dataroot: /data1/Taohy/dataset/COCO
    noise_trainpairs: data/coco_train2017_train_data.txt
    train_name: train2017
    batch_size: 4
    image_size: 224
    max_iter: 40
    iter_size: 1
    workers: 2

    # MCUD 分支数据：成对 IR/VI（MSRS train）
    irvis_dataroot: /data1/Taohy/dataset/MSRS
    infrare_name: train/ir
    visible_name: train/vi

    # 冻结 MAE 教师权重（MCUD 阶段必需，MCUD forward 用教师 latent 做监督）
    # teacher1 (IR)：FLIR 红外域适应预训练 MAE
    # teacher2 (VI)：ImageNet 预训练 MAE ViT-Base（Facebook 官方）
    teacher1_pth: /data1/Taohy/ModelReshow/modelReShow/DeFusion-plusplus-complete/pretrained/mae_flir_vit_base.pth
    teacher2_pth: /data1/Taohy/ModelReshow/modelReShow/DeFusion-plusplus-complete/pretrained/mae_pretrain_vit_base.pth

  val:
    name: val
    # CUD 验证分支：MSRS test/ir 单模态 grid-mask 自监督
    noise_dataroot: /data1/Taohy/dataset/MSRS
    noise_trainpairs: data/msrs_test_ir_val_data.txt
    train_name: test/ir
    batch_size: 4
    image_size: 224
    iter_size: 1
    max_iter: 40
    workers: 2
    val_batches: 50

    # MCUD 验证分支：MSRS test（IR/VI 成对）
    irvis_dataroot: /data1/Taohy/dataset/MSRS
    infrare_name: test/ir
    visible_name: test/vi

path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~               # 阶段 2 自己断点续训填这里（优先于 init_from）
  # 冷启动源：阶段 1 最终权重（只加载网络权重，optimizer/step/lr 全部重置从 0 开始）
  init_from: /data1/Taohy/ModelReshow/modelReShow/DeFusion-plusplus-complete/experiments/COCO_CUD_phase1/models/checkpoint-last.pth

logger:
  print_freq: 20
  save_checkpoint_freq: 5000

train:
  # ============ 训练模式 ============
  mode: mcud                    # 'cud' = 纯 CUD 阶段1；'mcud' = 联合阶段2

  lr: !!float 1e-4              # 峰值学习率（重新 warmup 热启动）
  min_lr: 0.0
  warmup_steps: 2000            # 阶段 2 从头 warmup
  steps: 30000                  # 总步数（联合训练）
  checkpoint_steps: 5000
  log_steps: 20
  beta1: 0.9
  beta2: 0.999
  max_grad_norm: 20
  manual_seed: 1

  # ============ loss 加权（可自行修改） ============
  # total_loss = cud_loss_weight * CUD_total + mcud_loss_weight * MCUD_total
  cud_loss_weight: 1.0          # CUD 分支总权重
  mcud_loss_weight: 8.0         # MCUD 分支总权重（CUD:MCUD ≈ 1.9:1，CUD 多一点）
  # CUD 内部各项权重（SelfTrainLoss），基于 COCO 实测量级均衡
  loss_weights:
    common: 26.0        # 共享区域重建 L1
    upper: 26.0         # IR 独有区域重建 L1
    lower: 26.0         # VI 独有区域重建 L1
    recon: 14.0         # 双图整体重建 L1（rec1+rec2，原始值约为单项 2 倍）
    fusion_l1: 25.0     # 融合图 L1（对照原图 gt_img1）
    fusion_ssim: 4.0    # 融合图 SSIM（波动大，权重取小）
