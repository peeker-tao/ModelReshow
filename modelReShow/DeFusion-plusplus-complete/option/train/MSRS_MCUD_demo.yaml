# DeFusion++ Stage-2 (MCUD) demo training on MSRS
# NOTE: full reproduction uses COCO for the CUD branch and MSRS train pairs
#       for the MCUD branch. This demo uses MSRS only so it runs out of the box.
# Run:  python selftrain_multimodal.py -opt option/train/MSRS_MCUD_demo.yaml
name: MSRS_MCUD_demo
use_tb_logger: true
model: MUCMTransformer

dataset:
  train:
    name: train
    noise_dataroot: /data1/Taohy/dataset/MSRS
    noise_trainpairs: data/msrs_noise_train_data.txt
    batch_size: 4
    image_size: 224
    max_iter: 40
    iter_size: 1
    workers: 2
    train_name: train/ir
    debug: true

    irvis_dataroot: /data1/Taohy/dataset/MSRS
    infrare_name: train/ir
    visible_name: train/vi
    irvis_trainpairs: data/msrs_irvis_train_data.txt

    teacher1_pth: ~
    teacher2_pth: ~

  val:
    name: val
    dataroot: /data1/Taohy/dataset/MSRS
    batch_size: 1
    workers: 1
    input_name: test/ir

network_G:
  in_nc: 3
  block_num: 2
  init: xavier
  hidden_channels: 128
  K: 4

path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

logger:
  print_freq: 10
  save_checkpoint_freq: 1

train:
  lr: !!float 1e-4
  beta1: 0.9
  beta2: 0.999
  max_grad_norm: 20
  max_grad_clip: 20
  niter: 500000
  epoch: 2

  lr_steps: [80, 160, 180, 190]
  lr_gamma: 0.5

  val_freq: 3
  kernel_freq: 1
  manual_seed: 1
